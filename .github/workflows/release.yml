name: Release

# Publishes to PyPI via OIDC trusted publishing (no stored API token) - the
# same short-lived-token mechanism this corpus exists to judge. Fires when a
# GitHub Release is published, and has run on every release from v0.2.0
# onward. PyPI side is configured as a trusted publisher: pypi.org -> owner
# Dashtid, repository subvectors, workflow release.yml, environment pypi.
#
# vectors/ packaging is settled: pyproject's
# [tool.hatch.build.targets.wheel.force-include] maps vectors -> subvectors/
# vectors, so the wheel ships the whole corpus and subvectors.corpus resolves
# it through importlib.resources without a repo checkout.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Pinned to a commit SHA like every other action here. pypa's own README
      # recommends a tag or SHA over a branch pointer, and this is the one job
      # holding id-token: write - the worst place to run whatever a moved ref
      # now points at. The github-actions block in dependabot.yml moves the
      # pin when pypa releases. The job has no other write surface.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
