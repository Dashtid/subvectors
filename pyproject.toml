[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subvectors"
version = "0.3.0"
description = "Reference matcher for OIDC CI/CD trust-condition conformance vectors"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

# The reference matcher has ZERO runtime dependencies on purpose: it is a
# correctness oracle a consumer can vendor or read, not a package they must
# trust at runtime. jsonschema/pytest are needed only to exercise the corpus.
[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/subvectors"]

# The corpus IS the product: ship the entire vectors/ tree (suites, schema,
# and its own CC0 LICENSE) inside the package so an installed consumer never
# needs the repo. subvectors.corpus resolves it via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"vectors" = "subvectors/vectors"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
