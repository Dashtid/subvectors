[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subvectors"
version = "0.6.0"
description = "Reference matcher for OIDC CI/CD trust-condition conformance vectors"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

# Found 2026-10-08: nine releases had shipped with no project URLs at all, so the
# PyPI page carried no way back to the repository, the vectors or the issue
# tracker. For a corpus whose point is auditability, that is the one link that
# must not be missing.
[project.urls]
Homepage = "https://github.com/Dashtid/subvectors"
Source = "https://github.com/Dashtid/subvectors"
Corpus = "https://github.com/Dashtid/subvectors/tree/main/vectors"
Issues = "https://github.com/Dashtid/subvectors/issues"
Changelog = "https://github.com/Dashtid/subvectors/releases"

# The reference matcher has ZERO runtime dependencies on purpose: it is a
# correctness oracle a consumer can vendor or read, not a package they must
# trust at runtime. jsonschema/pytest are needed only to exercise the corpus.
[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/subvectors"]

# The corpus IS the product: ship the entire vectors/ tree (suites, schema,
# and its own CC0 LICENSE) inside the package so an installed consumer never
# needs the repo. subvectors.corpus resolves it via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"vectors" = "subvectors/vectors"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# 100 columns matches .editorconfig and the rest of this estate's Python
# (subcheck, jobhunt, portfolio-site's backend). Ruff's own default is 88, which
# would rewrap code that was written to a wider measure.
#
# Rule selection is left at ruff's default on purpose: this is a zero-dependency
# corpus, and a hand-picked list here would be one more thing to keep in step
# with the other repositories.
[tool.ruff]
line-length = 100
target-version = "py313"
